name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      TEST_MONGODB_URI: "${{ secrets.TEST_MONGODB_URI || 'mongodb://testuser:testpass@localhost:27017/test_phonebook?authSource=admin' }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify environment setup
        run: |
          echo "NODE_ENV: $NODE_ENV"
          echo "TEST_MONGODB_URI is set: $([ -n "$TEST_MONGODB_URI" ] && echo "yes" || echo "no")"

      - name: Lint and format check
        run: bunx biome ci .

      - name: Run frontend tests
        run: bun run test:frontend

      - name: Run backend tests
        run: bun run test:backend

      - name: Build application
        run: bun run build
